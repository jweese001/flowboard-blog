<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} | FlowBoard Blog</title>
  <meta name="description" content="{{description}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-display: 'Instrument Serif', Georgia, serif;
      --font-body: 'Sora', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
      --bg-dark: rgb(10, 10, 10);
      --bg-dark-card: rgb(22, 22, 22);
      --text-on-dark: #ffffff;
      --text-on-dark-muted: rgba(255,255,255,.75);
      --text-on-dark-subtle: rgba(255,255,255,.5);
      --accent: #c77dcd;
      --border-dark-subtle: rgba(255,255,255,.08);
      --content-width: 760px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-body);
      line-height: 1.7;
      background: var(--bg-dark);
      color: var(--text-on-dark-muted);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .page {
      max-width: var(--content-width);
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
    }
    .eyebrow, time, .meta, .sources li {
      font-family: var(--font-mono);
      font-size: .82rem;
      color: var(--text-on-dark-subtle);
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    h1, h2 {
      font-family: var(--font-display);
      color: var(--text-on-dark);
      font-weight: 400;
      line-height: 1.15;
    }
    h1 {
      font-size: clamp(2rem, 1.5rem + 2.5vw, 3.5rem);
      margin: .35rem 0 1rem;
    }
    h2 {
      font-size: clamp(1.25rem, 1rem + 1.25vw, 1.75rem);
      margin-top: 2.5rem;
      margin-bottom: 1rem;
    }
    .dek {
      font-size: 1.05rem;
      color: var(--text-on-dark-muted);
      margin-bottom: 1rem;
    }
    .hero {
      width: 100%;
      border-radius: 10px;
      margin: 2rem 0;
      border: 1px solid var(--border-dark-subtle);
      display: {{hero_display}};
    }
    .content p { margin: 0 0 1.25rem; }
    .content ul, .content ol { margin: 0 0 1.25rem 1.5rem; }
    .content li { margin-bottom: .5rem; }
    .callout, pre {
      background: var(--bg-dark-card);
      border: 1px solid var(--border-dark-subtle);
      border-radius: 10px;
      padding: 1rem 1.1rem;
    }
    .meta-block, footer {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-dark-subtle);
    }
    .meta-block p, footer p { margin: .5rem 0; }
  </style>
</head>
<body>
  <main class="page">
    <div class="eyebrow">FlowBoard Blog</div>
    <h1>{{title}}</h1>
    <p class="dek">{{summary}}</p>
    <time datetime="{{date_iso}}">{{date_human}}</time>
    <img class="hero" src="{{hero_image}}" alt="{{hero_alt}}">
    <section class="content">
      {{body_html}}
    </section>
    <section class="meta-block">
      <div class="meta">Source repos</div>
      <p>{{source_repos}}</p>
      <div class="meta">Covered topics</div>
      <p>{{covered_topics}}</p>
    </section>
    <footer>
      <p><a href="./index.html">Back to index</a></p>
    </footer>
  </main>
</body>
</html>
