<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} | FlowBoard Blog</title>
    <meta name="description" content="{{description}}">
{{og_meta}}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-display: 'Instrument Serif', Georgia, serif;
            --font-body: 'Sora', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', monospace;

            --text-4xl: clamp(2rem, 1.5rem + 2.5vw, 3.5rem);
            --text-2xl: clamp(1.25rem, 1rem + 1.25vw, 1.75rem);
            --text-xl: clamp(1.1rem, 1rem + .5vw, 1.35rem);
            --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.1rem);
            --text-sm: clamp(.875rem, .8rem + .25vw, .95rem);
            --text-xs: clamp(.75rem, .7rem + .2vw, .85rem);

            --bg-dark: rgb(10, 10, 10);
            --bg-dark-elevated: rgb(18, 18, 18);
            --bg-dark-card: rgb(22, 22, 22);

            --text-on-dark: #ffffff;
            --text-on-dark-muted: rgba(255, 255, 255, .75);
            --text-on-dark-subtle: rgba(255, 255, 255, .5);

            --accent: #c77dcd;
            --accent-teal: #9dd9d9;

            --border-dark-subtle: rgba(255, 255, 255, .08);

            --space-sm: .5rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2rem;
            --space-2xl: 3rem;
            --space-3xl: 4rem;

            --content-width: 720px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-body);
            font-size: var(--text-base);
            line-height: 1.75;
            background: var(--bg-dark);
            color: var(--text-on-dark-muted);
            min-height: 100vh;
        }

        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .devlog-post {
            max-width: var(--content-width);
            margin: 0 auto;
            padding: var(--space-3xl) var(--space-xl);
        }

        .eyebrow {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--accent-teal);
            letter-spacing: .1em;
            text-transform: uppercase;
            margin-bottom: var(--space-md);
        }

        .devlog-post header {
            margin-bottom: var(--space-2xl);
        }

        .devlog-post h1 {
            font-family: var(--font-display);
            font-size: var(--text-4xl);
            font-weight: 400;
            line-height: 1.15;
            color: var(--text-on-dark);
            margin-bottom: var(--space-md);
        }

        .dek {
            font-size: var(--text-xl);
            color: var(--text-on-dark-muted);
            margin-bottom: var(--space-md);
        }

        .devlog-post time,
        .meta-heading,
        .topic-chip {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--text-on-dark-subtle);
            letter-spacing: .05em;
            text-transform: uppercase;
        }

        .hero-image {
            width: 100%;
            border-radius: 8px;
            margin: var(--space-2xl) 0;
            display: {{hero_display}};
            object-fit: cover;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, var(--bg-dark-elevated) 0%, var(--bg-dark-card) 100%);
        }

        .content h2 {
            font-family: var(--font-display);
            font-size: var(--text-2xl);
            font-weight: 400;
            color: var(--text-on-dark);
            margin-top: var(--space-2xl);
            margin-bottom: var(--space-lg);
        }

        .content p,
        .content ul,
        .content ol,
        .content pre,
        .content blockquote {
            margin-bottom: calc(var(--space-lg) + .15rem);
        }

        .content ul,
        .content ol {
            padding-left: var(--space-xl);
        }

        .content li {
            margin-bottom: var(--space-sm);
        }

        .content img {
            width: 100%;
            border-radius: 8px;
            margin: var(--space-lg) 0;
            display: block;
            background: linear-gradient(135deg, var(--bg-dark-elevated) 0%, var(--bg-dark-card) 100%);
        }

        .article-figure {
            width: min(calc(100% + 5rem), 52rem);
            margin: var(--space-xl) auto var(--space-2xl);
            margin-left: min(-2.5rem, calc((52rem - 100%) / -2));
            padding: .9rem;
            border: 1px solid var(--border-dark-subtle);
            border-radius: 12px;
            background: var(--bg-dark-card);
        }

        .article-figure img {
            margin: 0;
            border-radius: 6px;
        }

        .article-figure figcaption {
            margin-top: .85rem;
            color: var(--text-on-dark-subtle);
            font-size: var(--text-sm);
            line-height: 1.6;
        }

        .content code {
            font-family: var(--font-mono);
            font-size: .9em;
            background: var(--bg-dark-card);
            padding: .15em .4em;
            border-radius: 4px;
            border: 1px solid var(--border-dark-subtle);
        }

        .content pre,
        .callout,
        blockquote {
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            background: var(--bg-dark-card);
            padding: var(--space-lg);
            border-radius: 8px;
            border: 1px solid var(--border-dark-subtle);
            overflow-x: auto;
        }

        .content pre code {
            background: none;
            padding: 0;
            border: none;
        }

        .content strong {
            color: var(--text-on-dark);
            font-weight: 500;
        }

        .meta-block {
            margin-top: var(--space-3xl);
            padding-top: var(--space-xl);
            border-top: 1px solid var(--border-dark-subtle);
            display: grid;
            gap: var(--space-lg);
        }

        .meta-row p {
            margin-top: var(--space-sm);
            color: var(--text-on-dark-muted);
            font-size: var(--text-sm);
        }

        .topics {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-sm);
            margin-top: var(--space-sm);
        }

        .topic-chip {
            color: var(--accent-teal);
            border: 1px solid var(--border-dark-subtle);
            padding: 2px 8px;
        }

        footer {
            margin-top: var(--space-3xl);
            padding-top: var(--space-xl);
            border-top: 1px solid var(--border-dark-subtle);
        }

        footer a {
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            color: var(--text-on-dark-subtle);
        }

        footer a:hover {
            color: var(--accent);
        }

        @media (max-width: 768px) {
            .devlog-post {
                padding: var(--space-2xl) var(--space-lg);
            }
            .devlog-post h1 {
                font-size: clamp(1.75rem, 1.25rem + 2vw, 2.5rem);
            }
            .article-figure {
                width: 100%;
                margin-left: 0;
                padding: .75rem;
            }
            .content pre,
            .callout,
            blockquote {
                font-size: var(--text-xs);
                padding: var(--space-md);
            }
        }

        @media (max-width: 480px) {
            .devlog-post {
                padding: var(--space-xl) var(--space-md);
            }
            .devlog-post h1 {
                font-size: clamp(1.5rem, 1rem + 2vw, 2rem);
            }
            .content h2 {
                font-size: var(--text-xl);
            }
            .hero-image {
                margin: var(--space-lg) calc(-1 * var(--space-md));
                width: calc(100% + var(--space-xl));
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <article class="devlog-post">
        <header>
            <div class="eyebrow">FlowBoard Blog</div>
            <h1>{{title}}</h1>
            <p class="dek">{{summary}}</p>
            <time datetime="{{date_iso}}">{{date_human}}</time>
        </header>

        <img src="{{hero_image}}" alt="{{hero_alt}}" class="hero-image">

        <section class="content">
            {{body_html}}
        </section>

        <section class="meta-block">
            <div class="meta-row">
                <div class="meta-heading">Covered topics</div>
                <div class="topics">
                    {{covered_topics_html}}
                </div>
            </div>
        </section>

        <footer>
            <a href="./index.html">← Back to FlowBoard Blog</a>
        </footer>
    </article>
</body>
</html>
